services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: archon-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: archon
      POSTGRES_PASSWORD: archon
      POSTGRES_DB: archon
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archon"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
